<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Consulta Habitacional EP</title>
    <link rel="stylesheet" href="./styles.css?v=20260527-regla-35uf" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">EP</div>
        <div>
          <div class="eyebrow">Plataforma local</div>
          <h1>Consulta Habitacional</h1>
        </div>
      </div>
      <nav class="nav" aria-label="Principal">
        <button class="nav-item primary-action active" data-view="personas" title="Buscar persona">
          <span class="icon">ID</span>
          BUSCAR PERSONA
        </button>
        <button class="nav-item" data-view="dashboard" title="Dashboard">
          <span class="icon">DB</span>
          Dashboard
        </button>
        <button class="nav-item secondary-action" data-view="importar" title="Cargar base">
          <span class="icon">UP</span>
          CARGAR BASE
        </button>
        <button class="nav-item" data-view="alertas" title="Alertas">
          <span class="icon">!</span>
          Alertas
        </button>
        <button class="nav-item" data-view="gestion" title="Gestión">
          <span class="icon">GT</span>
          Gestión
        </button>
        <button class="nav-item" data-view="reportes" title="Reportes">
          <span class="icon">RP</span>
          Reportes
        </button>
      </nav>
      <div class="workspace-card">
        <p class="label">Comité activo</p>
        <select id="workspaceSelect" class="select workspace-select" aria-label="Comité activo"></select>
        <button id="newWorkspaceBtn" class="button secondary workspace-button" type="button">Nuevo comité</button>
      </div>
      <div class="storage-card">
        <p class="label">Datos locales</p>
        <p id="storageSummary">0 personas guardadas</p>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">Entidad patrocinante</div>
          <p class="top-title">Consulta Habitacional EP</p>
        </div>
        <div class="top-actions">
          <button id="exportJsonBtn" class="button secondary" type="button">Exportar JSON</button>
          <label class="button secondary file-button">
            Importar JSON
            <input id="importJsonInput" type="file" accept=".json,application/json" />
          </label>
          <button id="clearDataBtn" class="button danger" type="button">Limpiar comité</button>
        </div>
      </header>

      <main id="app" class="content"></main>
    </div>

    <template id="emptyTemplate">
      <div class="empty">Sin datos para mostrar</div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="./app.js?v=20260527-regla-35uf"></script>
  </body>
</html>
