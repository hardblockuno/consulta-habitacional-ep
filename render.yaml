services:
  # 1. Backend: API Django REST Framework
  - type: web
    name: consulta-habitacional-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: "/"
    envVars:
      # Pega aqui la connection string de Neon (ej: postgresql://user:pass@ep-xyz.us-east-2.aws.neon.tech/neondb?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.8"

  # 2. Frontend: Aplicacion React (Vite)
  - type: web
    name: consulta-habitacional-web
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://consulta-habitacional-api.onrender.com/api"
