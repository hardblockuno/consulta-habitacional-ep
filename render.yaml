services:
  # 1. Backend: API Django REST Framework
  - type: web
    name: consulta-habitacional-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 2 --timeout 300"
    healthCheckPath: "/"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"

  # 2. Frontend: Aplicacion React (Vite)
  - type: web
    name: consulta-habitacional-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://consulta-habitacional-api.onrender.com/api"
